name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Seed local D1 for versification anchor tests
        run: |
          npm run data:download
          npm run data:parse
          npm run db:schema:local
          npm run db:seed

      - run: npm run test:run