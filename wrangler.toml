name = "bible-api"
account_id = "f1d73e238b0fc9f95f93c8cabaad0e2a"  # Your Cloudflare Account ID
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Keep workers.dev subdomain active as backup
workers_dev = true

# Custom domain configuration - update this for your own deployment
# Remove or modify the routes section to use your own domain
routes = [
  { pattern = "bible-api.dws-cloud.com", custom_domain = true }
]

# Workers Caching: Cloudflare serves a cached copy of each response for as long as its
# Cache-Control allows (src/lib/response.ts), without running the Worker or touching D1.
# The cache is per Worker version, so each deploy starts empty. After changing data in
# production D1 (a translation update), redeploy so cached chapters and search pick it up.
[cache]
enabled = true

# CPU time per request (Workers Paid; default 30 s). A guard against runaway code, not D1 cost:
# time spent waiting on D1 is not CPU time. Enforced only when deployed.
[limits]
cpu_ms = 1000

# D1 Database binding
# IMPORTANT: If you're deploying your own instance, you need to:
# 1. Create your own D1 database: wrangler d1 create bible-db
# 2. Replace the database_id below with your new database ID
# 3. Run the schema and seed scripts (see README)
[[d1_databases]]
binding = "DB"
database_name = "bible-db"
database_id = "2ca76e47-a8ac-4762-960f-948456903507"  # Replace with your own database ID

# Rate limiting bindings (search is stricter — FTS5 is DB-heavy)
[[ratelimits]]
name = "SEARCH_RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "RANDOM_RATE_LIMITER"
namespace_id = "1002"

  [ratelimits.simple]
  limit = 60
  period = 60

[observability]
enabled = true
